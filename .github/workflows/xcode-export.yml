name: xcode-export

# One-off: pack the Xcode that xnu.yml builds with (oldest Xcode_*.app on
# macos-15-intel) for the local Sonoma build VM, which has no Apple ID to
# download Xcode with. Packed whole: removing anything breaks Apple's bundle
# seal, and Gatekeeper then kills xcodebuild as "damaged" (an ad-hoc re-seal
# is rejected too). The simulator runtimes live outside the bundle, so the
# whole app is only ~4.4 GB.

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [xcode-export]
    paths:
      - ".github/workflows/xcode-export.yml"

jobs:
  export:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - name: Pack
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          name=$(basename "$XC")
          DEVELOPER_DIR="$XC/Contents/Developer" xcodebuild -version
          DEVELOPER_DIR="$XC/Contents/Developer" xcodebuild -showsdks
          ls "$XC/Contents/Developer/Platforms"
          du -sh "$XC"
          mkdir -p out
          {
            echo "app=$name"
            DEVELOPER_DIR="$XC/Contents/Developer" xcodebuild -version
            sw_vers
          } > out/xcode-version.txt
          codesign --verify --strict "$XC"
          tar -C /Applications -czf "out/$name.tgz" "$name"
          (cd out && shasum -a 256 "$name.tgz" | tee SHA256SUMS)
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: xcode-export
          path: out/
          compression-level: 0
          retention-days: 7
