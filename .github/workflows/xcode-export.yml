name: xcode-export

# One-off: pack the Xcode that xnu.yml builds with (oldest Xcode_*.app on
# macos-15-intel) for the local Sonoma build VM, which has no Apple ID to
# download Xcode with. Trimmed to what xnu, ios-tools and mesa use: the
# toolchain, xcodebuild/iig, and the macOS, DriverKit and iPhoneOS SDKs.

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [xcode-export]
    paths:
      - ".github/workflows/xcode-export.yml"

jobs:
  export:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - name: Pack
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          name=$(basename "$XC")
          DEVELOPER_DIR="$XC/Contents/Developer" xcodebuild -version
          DEVELOPER_DIR="$XC/Contents/Developer" xcodebuild -showsdks
          ls "$XC/Contents/Developer/Platforms"
          du -sh "$XC"
          mkdir -p out
          {
            echo "app=$name"
            DEVELOPER_DIR="$XC/Contents/Developer" xcodebuild -version
            sw_vers
          } > out/xcode-version.txt
          # Simulators, the other device platforms, device disk images and the
          # bundled apps (Simulator, Instruments) are not used by any build here.
          tar -C /Applications -czf "out/$name.tgz" \
            --exclude "$name/Contents/Applications" \
            --exclude "$name/Contents/Developer/Platforms/iPhoneSimulator.platform" \
            --exclude "$name/Contents/Developer/Platforms/AppleTV*.platform" \
            --exclude "$name/Contents/Developer/Platforms/Watch*.platform" \
            --exclude "$name/Contents/Developer/Platforms/XR*.platform" \
            --exclude "$name/Contents/Developer/Platforms/iPhoneOS.platform/DeviceSupport" \
            --exclude "$name/Contents/Developer/Platforms/iPhoneOS.platform/Library/Developer/CoreSimulator" \
            "$name"
          shasum -a 256 "out/$name.tgz" | tee out/SHA256SUMS
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: xcode-export
          path: out/
          compression-level: 0
          retention-days: 7
