name: ios-tools

# iOS 16 userland programs for jasmine (ios/*.c): built with Xcode's iPhoneOS
# SDK, ad-hoc signed with ios/entitlements.plist (the SWEET AMFI takes any
# signature on the root filesystem and reads XML entitlements).

on:
  workflow_dispatch:
  push:
    branches: [jasmine]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          mkdir -p out
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          for src in ios/*.c; do
            name=$(basename "$src" .c)
            xcrun --sdk iphoneos clang -arch arm64 -mios-version-min=16.0 -isysroot "$SDK"               -O2 -Wall -Werror -o "out/$name" "$src"
            codesign -f -s - --entitlements ios/entitlements.plist "out/$name"
            codesign -dv "out/$name" 2>&1 | head -3
          done
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: ios-tools
          path: out/
