name: xnu

permissions:
  contents: read
  actions: read

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG
        default: SWEET
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
      build:
        description: kernel, ios (the ios/*.c userland tools only), both, or mesa (Mesa freedreno for iOS, mesa/)
        default: kernel
      mesa_task24_controls:
        description: Also build the Task 24 GL test without experimental patch0008 (Mesa only)
        type: boolean
        default: false
      topaz_4k:
        description: 1 = 4 KiB pages + AMP (TOPAZ_4K, all eight cores with mkadt.py --amp), 0 = 16 KiB pages, Gold only
        default: "0"
  push:
    branches: [main]
    paths:
      - "xnu/patches/**"
      - ".github/workflows/xnu.yml"


concurrency:
  group: xnu-${{ github.ref }}-${{ inputs.build || 'kernel' }}-${{ inputs.topaz_4k || '0' }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'SWEET' }}
  # ccache: xnu is ~2000 compiles; a patch usually changes a few of them
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPILERCHECK: content
  CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime,file_macro,pch_defines
  CCACHE_MAXSIZE: 3G
  CCACHE_WRAP: ${{ github.workspace }}/ccache-bin
  # makedefs/MakeInc.def (topaz 0140) reads it: 1 builds SWEET with 4 KiB pages
  TOPAZ_4K: ${{ inputs.topaz_4k == '1' && '1' || '' }}

jobs:
  # iOS 16 userland programs for jasmine (ios/*.c): Xcode's iPhoneOS SDK,
  # ad-hoc signed with ios/entitlements.plist (the SWEET AMFI takes any
  # signature on the root filesystem and reads XML entitlements).
  ios-tools:
    if: ${{ inputs.build == 'ios' || inputs.build == 'both' }}
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          mkdir -p out
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          for src in ios/*.c; do
            name=$(basename "$src" .c)
            xcrun --sdk iphoneos clang -arch arm64 -mios-version-min=16.0 -isysroot "$SDK" -O2 -Wall -Werror -o "out/$name" "$src"
            codesign -f -s - --entitlements ios/entitlements.plist "out/$name"
            codesign -dv "out/$name" 2>&1 | head -3
          done
          for src in ios/lib/*.c; do
            name=$(basename "$src" .c)
            xcrun --sdk iphoneos clang -arch arm64 -mios-version-min=16.0 -isysroot "$SDK" -O2 -Wall -Werror \
              -dynamiclib -install_name "/usr/local/bin/$name.dylib" -o "out/$name.dylib" "$src"
            codesign -f -s - "out/$name.dylib"
          done
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: ios-tools
          path: out/

  # Mesa freedreno + GL ES (sweetgl) for the iOS userland (G2): mesa/patches on mesa-26.2.5,
  # cross-built with Xcode's iPhoneOS SDK (mesa/ios-arm64.ini).
  mesa:
    if: ${{ inputs.build == 'mesa' }}
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q meson ninja mako pyyaml packaging
          brew install -q bison flex || true
      - name: Mesa source
        run: |
          git clone -q --depth 1 --branch mesa-26.2.5 https://gitlab.freedesktop.org/mesa/mesa.git mesa-src
          cd mesa-src
          for p in ../mesa/patches/*.patch; do git apply --verbose "$p"; done
      - name: Configure
        run: |
          export PATH="$RUNNER_TEMP/venv/bin:$(brew --prefix bison)/bin:$(brew --prefix flex)/bin:$PATH"
          cd mesa-src
          meson setup build --cross-file ../mesa/ios-arm64.ini -Dbuildtype=release             -Dplatforms= -Dgallium-drivers=freedreno -Dvulkan-drivers= -Dfreedreno-kmds=msm             -Dglx=disabled -Degl=disabled -Dgbm=disabled -Dopengl=false -Dgles1=disabled -Dgles2=enabled             -Dllvm=disabled -Dzstd=disabled -Dxmlconfig=disabled -Dexpat=disabled -Dvalgrind=disabled             -Dlibunwind=disabled -Dbuild-tests=false -Dshader-cache=disabled -Dperfetto=false             -Dvideo-codecs= -Dspirv-tools=disabled -Dallow-fallback-for=libdrm
      - name: Build
        run: |
          export PATH="$RUNNER_TEMP/venv/bin:$PATH"
          ninja -C mesa-src/build -k 0 src/gallium/drivers/freedreno/sweetgpu_fdtest src/gallium/frontends/sweetgl/sweetgpu_gltest src/gallium/frontends/sweetgl/libsweetca.dylib > build.log 2>&1 || true
          grep -E -A12 "^FAILED|error:|Undefined symbols" build.log | grep -v "warning:" | head -300 || true
          tail -15 build.log
          test -f mesa-src/build/src/gallium/drivers/freedreno/sweetgpu_fdtest
          test -f mesa-src/build/src/gallium/frontends/sweetgl/sweetgpu_gltest
          test -f mesa-src/build/src/gallium/frontends/sweetgl/libsweetca.dylib
      - name: Sign
        run: |
          mkdir -p out
          cp mesa-src/build/src/gallium/drivers/freedreno/sweetgpu_fdtest out/
          codesign -f -s - --entitlements ios/entitlements.plist out/sweetgpu_fdtest
          cp mesa-src/build/src/gallium/frontends/sweetgl/sweetgpu_gltest out/
          codesign -f -s - --entitlements ios/entitlements.plist out/sweetgpu_gltest
          # libsweetca (EAGL on sweetgl for CoreAnimation) and its test; the test is Objective-C, so clang builds it here
          cp mesa-src/build/src/gallium/frontends/sweetgl/libsweetca.dylib out/
          codesign -f -s - out/libsweetca.dylib
          xcrun --sdk iphoneos clang -arch arm64 -mios-version-min=16.0 -fobjc-arc -O1 -Wno-deprecated-declarations             mesa/darwin/sweetgl/sweetca_test.m -o out/sweetca_test             -framework Foundation -framework QuartzCore -framework CoreGraphics -framework IOSurface -framework OpenGLES             -Lout -lsweetca
          codesign -f -s - --entitlements ios/entitlements.plist out/sweetca_test
          # screenshot through the render server (G2 step 3)
          xcrun --sdk iphoneos clang -arch arm64 -mios-version-min=16.0 -O1 mesa/darwin/sweetgl/sweet_shot.m -o out/sweet_shot -framework Foundation -framework IOSurface
          codesign -f -s - --entitlements ios/entitlements.plist out/sweet_shot
          ls -la out
      - name: Task 24 pre-experiment control
        if: ${{ inputs.mesa_task24_controls }}
        run: |
          export PATH="$RUNNER_TEMP/venv/bin:$PATH"
          cd mesa-src
          git apply --reverse --check ../mesa/patches/0008-freedreno-a5xx-sysmem-barrier-experiment.patch
          git apply --reverse ../mesa/patches/0008-freedreno-a5xx-sysmem-barrier-experiment.patch
          ninja -C build src/gallium/frontends/sweetgl/sweetgpu_gltest > ../task24-control-build.log 2>&1 || {
            tail -100 ../task24-control-build.log
            exit 1
          }
          cp build/src/gallium/frontends/sweetgl/sweetgpu_gltest ../out/sweetgpu_gltest-pre-sysbarrier
          codesign -f -s - --entitlements ../ios/entitlements.plist ../out/sweetgpu_gltest-pre-sysbarrier
          {
            echo "source=$GITHUB_SHA"
            echo "control=all current patches except patch0008; identical diagnostic test source"
            shasum -a 256 ../out/sweetgpu_gltest ../out/sweetgpu_gltest-pre-sysbarrier
          } > ../out/task24-control-provenance.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mesa-ios
          path: out/
      - name: Build log on failure
        if: failure()
        run: |
          cat mesa-src/build/meson-logs/meson-log.txt 2>/dev/null | tail -80 || true

  build:
    if: ${{ inputs.build != 'ios' && inputs.build != 'mesa' }}
    # macos-14 is in retirement brownouts. Preserve xnu-8796's RPC ABI by
    # replaying pinned Xcode15 IIG output; compile/link on a supported runner.
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Fetch build script
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          # 12.5-14.3 use the top-level patches dir; ours go next to blacktop's
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
          # libfirehose_kernel is built arm64e-only; the SWEET kernel is plain arm64.
          # topaz: Cortex-A53/A73 (ARMv8.0), so the same -mcpu as the kernel
          # (clang's apple-m1 default emits LSE atomics and LDAPR)
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="arm64" VALID_ARCHS="arm64" OTHER_CFLAGS="-mkernel -nostdinc -Wno-packed -mcpu=cortex-a53"/' dxb/build.sh
          grep -c 'OTHER_CFLAGS="-mkernel -nostdinc -Wno-packed -mcpu=cortex-a53"' dxb/build.sh
          # xnu's makedefs take CC/CXX from the environment dxb exports; xcodebuild
          # (mig, ctf tools) needs a single executable, so point at wrappers
          sed -i '' 's|export CC="$(xcrun -find clang)"|export CC="$CCACHE_WRAP/clang"|; s|export CXX="$(xcrun -find clang++)"|export CXX="$CCACHE_WRAP/clang++"|' dxb/build.sh
          grep -c 'export CC="$CCACHE_WRAP/clang"' dxb/build.sh
          ls dxb/patches

      - name: Deps
        run: |
          brew install jq gum bash cmake ninja ccache
          # build.sh only checks that xcodes exists (Xcode is preinstalled); no bottle on macOS 14
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig
          mkdir -p "$CCACHE_WRAP"
          # Assembly (.s) includes the generated assym.s, which ccache does not hash for
          # assembler input: a cached object kept stale structure offsets with TOPAZ_4K +
          # AMP (topaz tools/build-local.sh). No cache for it.
          for t in clang clang++; do
            printf '#!/bin/sh\nfor a; do case "$a" in *.s) exec %s "$@";; esac; done\nexec ccache %s "$@"\n' "$(xcrun -find $t)" "$(xcrun -find $t)" > "$CCACHE_WRAP/$t"
            chmod +x "$CCACHE_WRAP/$t"
          done
          cat "$CCACHE_WRAP/clang"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ env.MACHINE_CONFIG }}-${{ env.KERNEL_CONFIG }}-${{ env.TOPAZ_4K == '1' && '4k-' || '' }}${{ hashFiles('xnu/patches/**', '.github/workflows/xnu.yml') }}
          restore-keys: |
            ccache-${{ env.MACHINE_CONFIG }}-${{ env.KERNEL_CONFIG }}-${{ env.TOPAZ_4K == '1' && '4k-' || '' }}

      - name: Restore pinned Xcode15 IIG generation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Refresh a 90-day artifact on each kernel build. If no refreshed
          # copy exists yet, bootstrap from the last verified Wi-Fi buildtree.
          cached_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=xnu8796-iig-xcode15&per_page=100" --jq '[.artifacts[] | select(.expired == false)][0].workflow_run.id // empty')
          if [ -n "$cached_run" ]; then
            gh run download "$cached_run" -n xnu8796-iig-xcode15 -D legacy-iig
          else
            gh run download 40159794543 -n xnu-buildtree -D legacy-buildtree
            python3 tools/xnu-legacy-iig.py seed legacy-buildtree/buildtree.tgz legacy-iig
          fi
          echo "LEGACY_IIG_CACHE=$GITHUB_WORKSPACE/legacy-iig" >> "$GITHUB_ENV"
          printf '#!/bin/sh\nexec python3 "%s/tools/xnu-legacy-iig.py" replay --cache "$LEGACY_IIG_CACHE" -- "$@"\n' "$GITHUB_WORKSPACE" > legacy-iig-wrapper
          chmod +x legacy-iig-wrapper
          echo "IIG=$GITHUB_WORKSPACE/legacy-iig-wrapper" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: xnu8796-iig-xcode15
          path: legacy-iig/
          retention-days: 90

      - name: Build
        working-directory: dxb
        env:
          # keep going after errors so one run reports every compile failure
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: |
          ccache -z
          set -o pipefail
          bash build.sh 2>&1 | tee kernel-build.log
          if [ -f patches/j0059a-jasmine-cpu-check-reference.patch ]; then
            grep -q 'SWEET CPUCHECK: boot reference ready; OSM setup disabled' xnu/osfmk/arm64/sweet_osm.c
            python3 ../tools/cpuclk/check-reference-test.py xnu/osfmk/arm64/sweet_osm.c
          fi
          if [ -f patches/j0102-jasmine-cpu-rpm-neutral-probe.patch ]; then
            grep -q 'sweet_rpm_cpu_probe' xnu/osfmk/arm64/sweet_osm.c
            python3 ../tools/cpuclk/rpm-probe-test.py xnu/bsd/dev/sweet_rpm.c
            nm fakeroot/System/Library/Kernels/kernel.development.sweet | grep -E '[[:space:]][TtSs][[:space:]]_sweet_rpm_cpu_probe$'
          fi
          if [ -f patches/j0103-jasmine-cpu-saw16-backend.patch ]; then
            grep -q '#include "sweet_cpu_voltage.h"' xnu/osfmk/arm64/sweet_osm.c
            python3 ../tools/cpuclk/voltage-test.py xnu/osfmk/arm64/sweet_cpu_voltage.h
            strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep 'SWEET CPUVOLT:'
          fi
          if [ -f patches/j0104-jasmine-cpu-dvfs.patch ]; then
            grep -q '#include "sweet_dvfs.h"' xnu/osfmk/arm64/sweet_osm.c
            grep -q 'sweet_dvfs_start();' xnu/osfmk/arm64/sweet_osm.c
            python3 ../tools/cpuclk/dvfs-test.py xnu/osfmk/arm64/sweet_dvfs.h
            strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep 'SWEET DVFS: ready='
          fi
          if [ -f patches/j0105-jasmine-cpu-memory-surface-diagnostics.patch ]; then
            grep -q '#include "sweet_memcheck.h"' xnu/osfmk/arm64/sweet_osm.c
            python3 ../tools/cpuclk/memcheck-test.py xnu/osfmk/arm64/sweet_memcheck.h
            strings fakeroot/System/Library/Kernels/kernel.development.sweet | grep 'checkmem: %s'
            nm fakeroot/System/Library/Kernels/kernel.development.sweet | grep -E '[[:space:]][Tt][[:space:]]_sweet_surface_stats$'
          fi
          if [ -f patches/j0106-jasmine-surface-zombie-pixels.patch ]; then
            python3 ../tools/cpuclk/surface-release-test.py xnu/iokit/Kernel/arm/SweetSurface.cpp
          fi
          if [ -f patches/j0100-jasmine-wifi-defaults.patch ]; then
            python3 ../tools/check-wifi-integration.py --source xnu --log kernel-build.log
            nm fakeroot/System/Library/Kernels/kernel.development.sweet > wifi-symbols.txt
            for symbol in topaz_modem_init topaz_modem_stop sweet_surface_pinned_note _Z17sweet_surface_pinP12SweetSurface _Z19sweet_surface_unpinP12SweetSurface; do
              grep -E "[[:space:]][TtSs][[:space:]]_$symbol$" wifi-symbols.txt
            done
          fi
          # The upstream wrapper can skip a non-applying patch and still build.
          # A framebench image is unusable unless the hooks are actually linked.
          if [ -f patches/j0099-jasmine-framebench.patch ]; then
            test -f xnu/osfmk/arm64/sweet_bench.inc
            grep -q 'BC_SAMPLES 65536u' xnu/osfmk/arm64/sweet_bench.inc
            grep -q 'bench mark' xnu/osfmk/arm64/sweet_bench.inc || grep -q '"mark "' xnu/osfmk/arm64/sweet_bench.inc
            nm fakeroot/System/Library/Kernels/kernel.development.sweet > framebench-symbols.txt
            for symbol in sweet_bench_event sweet_bench_blob sweet_bench_alloc sweet_bench_enabled; do
              # Kernel __TEXT_EXEC symbols can be reported as S rather than T.
              grep -E "[[:space:]][TtSs][[:space:]]_$symbol$" framebench-symbols.txt
            done
          fi
          ccache -s

      - name: Package build tree for local compiles
        if: always()
        run: |
          # Generated headers, config option headers, mig output and the patched
          # source: enough to re-run any single compile command from the log locally.
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p sdk-kernel-platform
          cp -R "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/ || true
          tar czf buildtree.tgz \
            --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
            --exclude='kernel.development.*' --exclude='.git' \
            -C dxb build/xnu.obj fakeroot/usr/local/include xnu \
            -C .. sdk-kernel-platform
          ls -la buildtree.tgz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-buildtree
          path: buildtree.tgz
          retention-days: 7

      - name: Inspect closed KDK support libs
        if: always()
        run: |
          mkdir -p out/kdk-libs
          for lib in /Library/Developer/KDKs/*/System/Library/KernelSupport/lib*.a; do
            b=$(basename "$lib" .a)
            ar t "$lib" > "out/kdk-libs/$b.members.txt" 2>&1 || true
            nm -m "$lib" > "out/kdk-libs/$b.nm.txt" 2>&1 || true
            lipo -info "$lib" >> out/kdk-libs/arch.txt 2>&1 || true
          done
          ls -la out/kdk-libs

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: warn
